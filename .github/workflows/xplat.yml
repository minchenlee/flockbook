name: xplat

# The cross-platform port (Rust + iced) in xplat/, and the mod's Node tests on the Rust sidecar. The one place the
# Rust tests run. Runs only when xplat/, herdr-app/ or this file changes.
on:
  push:
    branches: [main]
    paths:
      - "xplat/**"
      - "herdr-app/**"
      - ".github/workflows/xplat.yml"
  pull_request:
    branches: [main]
    paths:
      - "xplat/**"
      - "herdr-app/**"
      - ".github/workflows/xplat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: xplat

jobs:
  linux:
    name: Linux build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The install's upgrade tests and its known-files table read the release tags and main's history.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xplat -> target

      # winit links these for X11 and Wayland. fonts-noto-cjk: the CJK fallback tests draw real Chinese with the
      # Linux faces (a bare runner has none, and those tests then skip).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev fonts-noto-cjk

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Headless: iced_test on tiny-skia (CPU), a fake herdr, fixtures. No window, no herdr server.
      # The live terminal tests are #[ignore] and need a named test session: they do not run here.
      - name: Test
        run: cargo test --workspace --locked

      # The helper a Linux machine gets (static musl, as the release zip carries it): its real size must pass
      # hc's 8 MB file.write in as few parts as it needs, and the remote tests install and run this file.
      - name: Remote helper (x86_64 musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl -p flockbook-modfeed
          bin=target/x86_64-unknown-linux-musl/release/flockbook-modfeed
          echo "musl helper: $(stat -c %s "$bin") bytes"
          FLOCKBOOK_TEST_HELPER="$PWD/$bin" cargo test --locked -p flockbook-modfeed --test remote -- --nocapture

      # The aarch64 Linux helper: built with Rust's own linker (the musl target carries its libc), size only;
      # it does not run on this x86_64 runner.
      - name: Remote helper (aarch64 musl, size)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl -p flockbook-modfeed
          bin=target/aarch64-unknown-linux-musl/release/flockbook-modfeed
          file "$bin"
          echo "musl aarch64 helper: $(stat -c %s "$bin") bytes"

      # The mod's Node tests again, this time against the Rust sidecar too (sidecar.real.test.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm test with the Rust sidecar
        working-directory: herdr-app
        env:
          FLOCKBOOK_MODFEED: ${{ github.workspace }}/xplat/target/debug/flockbook-modfeed
        run: npm test

  windows:
    name: Windows compile check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The install's upgrade tests and its known-files table read the release tags and main's history.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xplat -> target
          key: x86_64-pc-windows-msvc

      # The app crates only: the spikes and most tests use Unix sockets or getrusage. flockbook's lib holds the
      # window glass, so this compiles the Mica path (window_vibrancy::apply_mica) for Windows.
      - name: Check
        run: cargo check -p herdr-core -p fb-ui -p flockbook --lib --bins --locked --target x86_64-pc-windows-msvc

      # The mod's sidecar runs on Windows: its tests and herdr-core's (the Unix-socket ones are Unix only).
      - name: Test (herdr-core, flockbook-modfeed)
        run: cargo test --locked -p herdr-core -p flockbook-modfeed --target x86_64-pc-windows-msvc

  macos:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The install's upgrade tests and its known-files table read the release tags and main's history.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xplat -> target

      # Includes the AppKit glass (NSVisualEffectView) path.
      - name: Build
        run: cargo build --workspace --all-targets --locked
