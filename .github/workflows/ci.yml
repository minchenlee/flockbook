name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # Manual run: the offline checks and the two checks with a real window.
  # only: check names (spaces or commas) for both OSes; the phone page's (morph, composer, note, transport, earlier-held)
  # run in the build job, with no app UI check job; macos15_only: skip the macos-26 jobs.
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these UI checks (e.g. "question busy-tab", or a phone page check: "morph"); empty = all'
        type: string
        default: ''
      macos15_only:
        description: 'Only build and run on macOS 15'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # the gate job reads this workflow's earlier runs

# A newer push to a ci/ branch or a PR cancels the older run; main runs to the end.
# The event is in the group, so a manual run does not cancel the push run on the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  # A push to main whose SHA already passed a push run (its ci/ branch) skips every other job: the run shows green.
  # Manual runs do not count: they may have run only some checks or only macOS 15.
  gate:
    name: Already green?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      app: ${{ steps.paths.outputs.app }}
      native: ${{ steps.only.outputs.native }}
      native_run: ${{ steps.only.outputs.native_run }}
      web: ${{ steps.only.outputs.web }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          skip=0
          if [ "$ON_MAIN" = true ]; then
            # An API error counts as "not found": the run goes on.
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion == \"success\" and .event == \"push\") | .html_url] | first // empty") || found=
            if [ -n "$found" ]; then skip=1; echo "::notice title=CI skipped::$GITHUB_SHA already passed: $found"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Whether the macOS app jobs run: only when a file the Mac app is built or tested from changed (Swift
          # sources and tests, the web page it serves, its scripts, this workflow). The Herdr app mod, the Rust
          # helpers (xplat.yml and helpers.yml test them), docs and the site skip them. A manual run always runs them.
          app=1
          if [ "$EVENT" != workflow_dispatch ]; then
            # A new branch's first push has no "before": compare with main (the branch's fork point from it).
            if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=main; fi
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename'); then
              n=$(printf '%s\n' "$files" | grep -c . || true)
              app_files=$(printf '%s\n' "$files" | grep -E '^(Sources/|Tests/|web/|Package\.(swift|resolved)$|scripts/|\.github/workflows/ci\.yml$)' \
                | grep -Ev '^scripts/(helper-release\.mjs|known-files\.mjs|package-mod\.sh|install-from-release\.sh)$' || true)
              if [ "$n" -gt 0 ] && [ "$n" -lt 300 ] && [ -z "$app_files" ]; then
                app=0
                echo "::notice title=macOS app jobs skipped::no Mac app file changed"
              fi
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

      # `only` split in two: the phone page's checks (scripts/web-test.mjs sections, in the build job) and the app's
      # (scripts/ui-checks.sh). Only web checks named: the app's UI check jobs (26 and macOS 15) are skipped.
      - id: only
        env:
          ONLY: ${{ inputs.only }}
        run: |
          native=; web=
          for want in ${ONLY//,/ }; do
            case " transport earlier-held morph composer note " in
              *" $want "*) web="$web $want" ;;
              *) native="$native $want" ;;
            esac
          done
          native_run=1
          if [ -n "$ONLY" ] && [ -z "$native" ]; then native_run=0; echo "::notice title=App UI checks skipped::only web checks named ($ONLY)"; fi
          echo "native=${native# }" >> "$GITHUB_OUTPUT"
          echo "native_run=$native_run" >> "$GITHUB_OUTPUT"
          echo "web=${web# }" >> "$GITHUB_OUTPUT"

  build:
    name: Build + checks
    needs: gate
    if: ${{ needs.gate.outputs.skip != '1' && !inputs.macos15_only && needs.gate.outputs.app != '0' }}
    # macos-26 (arm64) carries Xcode 26.x; Package.swift needs Swift 6.2 and the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Pin the toolchain: Xcode 26.1.1 ships Swift 6.2.1, the same compiler the app is developed with.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26.1.1-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: swift build

      # The debug app for the UI check groups, with what it loads from beside it (@loader_path).
      # A tar keeps the executable bit and Sparkle's symlinks; upload-artifact drops both.
      - name: Pack HerdrDesk
        run: |
          BIN="$(swift build --show-bin-path)"
          tar -czf herdrdesk-macos26.tgz -C "$BIN" HerdrDesk Sparkle.framework SwiftTerm_SwiftTerm.bundle

      - uses: actions/upload-artifact@v4
        with:
          name: herdrdesk-macos26-${{ github.run_id }}
          retention-days: 14
          overwrite: true
          path: herdrdesk-macos26.tgz

      # Headless checks only: they use a fake herdr socket and fixtures, no herdr server, no window.
      - name: HerdrKitChecks
        run: swift run HerdrKitChecks

      # The phone page in a headless browser (Chrome's own headless mode, no window), against the fake hub, CPU 2x
      # slower, every wait on a state: the open/close morph (the first page held as a phone's round trip) and the
      # composer at the bottom from the first frame, a note from another agent as one line. `only` with web checks: those sections only. Each section runs;
      # the step fails if any failed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phone page morph, composer and notes (headless browser)
        timeout-minutes: 10
        env:
          WEB: ${{ needs.gate.outputs.web }}
        run: |
          failed=
          for section in ${WEB:-morph composer note}; do
            node scripts/web-test.mjs --only "$section" || failed="$failed $section"
          done
          if [ -n "$failed" ]; then echo "::error title=Phone page checks failed::$failed"; exit 1; fi

  # The Herdr app mod's Node tests (fake gpui-kit, gpui-base and herdr modules; no app, no network).
  mod:
    name: Herdr app mod tests
    needs: gate
    if: ${{ needs.gate.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test/known-files.test.mjs reads the release tags
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm test
        working-directory: herdr-app
        run: npm test

  # The offline checks in 3 groups at once (SHARD in scripts/ui-checks.sh); one group when `only` names checks.
  # 3 groups here and 2 on macOS 15: 5 macOS jobs, the most that run at the same time.
  ui:
    name: UI checks (${{ matrix.shard }})
    needs: [gate, build]
    if: ${{ needs.gate.outputs.native_run == '1' }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only && '[1]' || '[1, 2, 3]') }}
    env:
      BIN: build/bin/HerdrDesk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: herdrdesk-macos26-${{ github.run_id }}

      - name: Unpack HerdrDesk
        run: mkdir -p build/bin && tar -xzf herdrdesk-macos26.tgz -C build/bin

      # Preview stores and offscreen windows: no herdr server. Each check has its own time limit (UI_CHECK_TIMEOUT).
      - name: Offline UI checks
        timeout-minutes: 20
        env:
          UI_CHECK_TIMEOUT: '180'
          ONLY: ${{ needs.gate.outputs.native }}
          SHARD: ${{ !inputs.only && format('{0}/3', matrix.shard) || '' }}
        run: scripts/ui-checks.sh offline build/ui-checks

      # The two checks with a real window and full screen: manual runs only, in the first group,
      # also when an offline check failed.
      - name: Real-window checks
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && matrix.shard == 1 }}
        timeout-minutes: 10
        env:
          FLOCKBOOK_VISIBLE_OK: '1'
          UI_CHECK_TIMEOUT: '60'
          ONLY: ${{ needs.gate.outputs.native }}
        run: scripts/ui-checks.sh real build/ui-checks-real

      - name: Upload screenshots
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 14
          overwrite: true
          if-no-files-found: warn
          path: |
            build/ui-checks
            build/ui-checks-real
            build/snapshots-*

  # macOS 15 (the lowest supported): build on macos-26 (the only runner with Xcode 26 and Swift 6.2),
  # then run the built binaries on a macos-15 runner. HerdrKitTests (Swift Testing) needs the toolchain: 26 only.
  # The headless checks and the app build in two jobs at once: the checks also run when the app does not build.
  build-macos15:
    name: Build for macOS 15
    needs: gate
    if: ${{ needs.gate.outputs.skip != '1' && needs.gate.outputs.app != '0' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    outputs:
      bin: ${{ steps.kit.outputs.bin }}
    steps:
      - uses: actions/checkout@v4

      # Package.swift, the icon's deployment target and Info.plist name the same lowest macOS.
      - name: Lowest macOS in the sources
        run: scripts/check-min-os.sh 15.0

      # Its own cache: the app job builds release, this one debug.
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm15-kit-${{ runner.os }}-xcode26.1.1-${{ hashFiles('Package.resolved') }}
          restore-keys: spm15-${{ runner.os }}-xcode26.1.1-

      - name: Build HerdrKitChecks, flockbook-notify and flockbook-statusline
        id: kit
        run: |
          swift build --product HerdrKitChecks
          swift build --product flockbook-notify
          swift build --product flockbook-statusline
          BIN="$(swift build --show-bin-path)"
          scripts/check-min-os.sh 15.0 "$BIN/HerdrKitChecks" "$BIN/flockbook-notify" "$BIN/flockbook-statusline"
          otool -L "$BIN/HerdrKitChecks" "$BIN/flockbook-notify" "$BIN/flockbook-statusline"
          # Archive with the build's own path: upload-artifact drops the executable bit.
          tar -czf kit-macos15.tgz -C / "${BIN#/}/HerdrKitChecks" "${BIN#/}/flockbook-notify" "${BIN#/}/flockbook-statusline"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kit-macos15-${{ github.run_id }}
          retention-days: 14
          overwrite: true
          path: kit-macos15.tgz

  bundle-macos15:
    name: Bundle for macOS 15
    needs: gate
    # Only for the UI checks on macOS 15 (test-macos15): skipped with them.
    if: ${{ needs.gate.outputs.skip != '1' && needs.gate.outputs.app != '0' && needs.gate.outputs.native_run == '1' }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm15-app-${{ runner.os }}-xcode26.1.1-${{ hashFiles('Package.resolved') }}
          restore-keys: spm15-${{ runner.os }}-xcode26.1.1-

      # Release build, ad-hoc signed (no SIGN_ID on CI).
      - name: Bundle Flockbook.app
        run: |
          scripts/bundle.sh
          scripts/check-min-os.sh 15.0 build/Flockbook.app build/Flockbook.app/Contents/MacOS/flockbook-notify build/Flockbook.app/Contents/MacOS/flockbook-statusline
          otool -L build/Flockbook.app/Contents/MacOS/HerdrDesk
          tar -czf app-macos15.tgz build/Flockbook.app

      - uses: actions/upload-artifact@v4
        with:
          name: app-macos15-${{ github.run_id }}
          retention-days: 14
          overwrite: true
          path: app-macos15.tgz

  kit-macos15:
    name: HerdrKitChecks on macOS 15
    needs: build-macos15
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # The fixtures; nothing is built here (no Xcode 26 on this runner).
      - uses: actions/checkout@v4

      - name: System
        run: sw_vers

      - uses: actions/download-artifact@v4
        with:
          name: kit-macos15-${{ github.run_id }}

      # Unpacked at the build's own path (the same checkout path on both runners).
      - name: HerdrKitChecks
        env:
          BIN: ${{ needs.build-macos15.outputs.bin }}
        run: |
          tar -xzf kit-macos15.tgz -C /
          "$BIN/HerdrKitChecks"
          # The agents' command loads and runs on 15: --help prints its usage and exits 0.
          "$BIN/flockbook-notify" --help
          "$BIN/flockbook-statusline" --help

  # The same offscreen checks as on 26 (preview stores, offscreen windows, no herdr server), from the bundled app,
  # in 2 groups (see the ui job).
  test-macos15:
    name: Run on macOS 15 (${{ matrix.shard }})
    needs: [gate, bundle-macos15]
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only && '[1]' || '[1, 2]') }}
    steps:
      # The scripts and the fixtures; nothing is built here (no Xcode 26 on this runner).
      - uses: actions/checkout@v4

      - name: System
        run: sw_vers

      - uses: actions/download-artifact@v4
        with:
          name: app-macos15-${{ github.run_id }}

      - name: Offline UI checks
        timeout-minutes: 20
        env:
          UI_CHECK_TIMEOUT: '180'
          ONLY: ${{ needs.gate.outputs.native }}
          SHARD: ${{ !inputs.only && format('{0}/2', matrix.shard) || '' }}
          BIN: build/Flockbook.app/Contents/MacOS/HerdrDesk
        run: |
          tar -xzf app-macos15.tgz
          scripts/ui-checks.sh offline build/ui-checks-macos15

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks-macos15-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 14
          overwrite: true
          if-no-files-found: warn
          path: |
            build/ui-checks-macos15
            build/snapshots-*
