name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v0.1.0)'
        required: true
        type: string

# The build job only reads the repo; only the publish job writes the release.
permissions:
  contents: read

jobs:
  # The Rust flockbook-modfeed for every platform (the Herdr app mod's helper).
  helpers:
    uses: ./.github/workflows/helpers.yml

  # Signed + notarized universal Flockbook.app as .zip and .dmg. Signing: import the
  # Developer ID cert into a temporary keychain, sign with hardened runtime, notarize, staple. Without secrets: ad-hoc sign, no notarization,
  # release notes say "unsigned".
  build:
    name: Build macOS app
    needs: helpers
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pin the toolchain: Xcode 26.1.1 ships Swift 6.2.1, the same compiler the app is developed with.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      ARCHS: arm64 x86_64
    outputs:
      notes_file: ${{ steps.notes.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag and version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (arm64 + x86_64)
        run: |
          for a in $ARCHS; do swift build -c release --product HerdrDesk --arch "$a"; done

      # Headless checks only: they use a fake herdr socket and fixtures, no herdr server, no window.
      - name: HerdrKitChecks
        run: swift run HerdrKitChecks

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret set; skipping import (ad-hoc sign later)."
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

      # SPARKLE_PUBLIC_KEY (a repository variable, not secret) turns on auto-update in the app.
      - name: Bundle and sign
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/bundle.sh

      # scripts/package.sh builds the dmg window with dmgbuild (hash-pinned in scripts/dmg/requirements.txt, own venv).
      - name: Python for dmgbuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Notarize and package
        env:
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${SIGN_ID:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            NOTARIZED=1
          else
            NOTARIZED=0
            echo "Signing or notarization secrets missing; publishing an unsigned build."
          fi
          echo "NOTARIZED=$NOTARIZED" >> "$GITHUB_ENV"
          if [ "$NOTARIZED" = 1 ]; then scripts/notarize.sh build/Flockbook.app; fi
          scripts/package.sh
          if [ "$NOTARIZED" = 1 ]; then scripts/notarize.sh "dist/Flockbook-$VERSION.dmg"; fi
          # The Herdr app mod (preview): layout, mod and the Rust flockbook-modfeed for every platform in one zip,
          # plus the one-line install's assets (install.sh, flockbook-modfeed-<target>).
          rm -f helpers/*/version.txt
          NOTARIZE="$NOTARIZED" HELPERS=helpers scripts/package-mod.sh
          (cd dist && shasum -a 256 Flockbook-* flockbook-modfeed-* install.sh > SHA256SUMS && cat SHA256SUMS)
          {
            if [ "$NOTARIZED" = 1 ]; then
              echo "Signed with a Developer ID and notarized by Apple."
            else
              echo "**Unsigned build.** It is not signed with a Developer ID and not notarized."
              echo "macOS blocks it on first open. To run it anyway: \`xattr -dr com.apple.quarantine /Applications/Flockbook.app\`."
            fi
            echo
            echo "Requires macOS 15 or later and a running Herdr. Universal (Apple silicon + Intel)."
            echo "Unofficial: not affiliated with, endorsed by, or supported by Herdr, Inc."
          } > dist/NOTES.md

      # Auto-update feed: signs the zip (EdDSA) and writes dist/appcast.xml, itself signed. Only for notarized
      # builds, so an unsigned build never reaches installed apps as an update.
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          if [ -z "${SPARKLE_PUBLIC_KEY:-}" ] && [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "No Sparkle keys: no appcast, this build does not auto-update."; exit 0
          fi
          if [ -z "${SPARKLE_PUBLIC_KEY:-}" ] || [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "Set both the SPARKLE_PUBLIC_KEY variable and the SPARKLE_ED_PRIVATE_KEY secret."; exit 1
          fi
          if [ "$NOTARIZED" != 1 ]; then echo "Not notarized: no appcast."; exit 0; fi
          DOWNLOAD_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
          RELEASE_NOTES_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
          LINK="https://flockbook.mclee.dev" \
            scripts/appcast.sh "dist/Flockbook-$VERSION.zip" dist

      # docs/release-notes/<tag>.md, when it exists, replaces the notes above: its text, Installation, Full Changelog.
      - name: Release notes
        id: notes
        run: |
          code=0
          APPCAST=$([ -f dist/appcast.xml ] && echo 1 || true) scripts/release-notes.sh "$TAG" > dist/NOTES.custom.md || code=$?
          if [ "$code" = 0 ]; then
            mv dist/NOTES.custom.md dist/NOTES.md
            echo "file=1" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then
            rm -f dist/NOTES.custom.md; echo "No docs/release-notes/$TAG.md: GitHub's generated notes."
          else
            exit "$code"
          fi
          cat dist/NOTES.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flockbook-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: flockbook-macos
          path: dist

      # appcast.xml exists only for builds that auto-update (see the Appcast step).
      - name: List assets
        id: assets
        run: |
          {
            echo 'files<<EOF'
            ls dist/*.zip dist/*.dmg dist/SHA256SUMS dist/install.sh dist/flockbook-modfeed-*
            if [ -f dist/appcast.xml ]; then echo dist/appcast.xml; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: dist/NOTES.md
          # Off with docs/release-notes/<tag>.md: that file already has the changes and the Full Changelog link.
          generate_release_notes: ${{ needs.build.outputs.notes_file != '1' }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
