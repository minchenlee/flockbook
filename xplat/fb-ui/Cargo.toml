[package]
name = "fb-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable iced widgets, theme tokens, fonts and icons for Flockbook"

[dependencies]
iced = { workspace = true, features = ["image", "svg", "canvas", "tiny-skia"] }
unicode-segmentation = "1"
# The script groups of the CJK fallback (already in the tree through cosmic-text).
unicode-script = "0.5"
# We feed bytes; we never spawn a pty.
alacritty_terminal = { version = "0.26", default-features = false }

[dev-dependencies]
iced_test.workspace = true
png.workspace = true
