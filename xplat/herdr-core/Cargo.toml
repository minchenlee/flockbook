[package]
name = "herdr-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust port of the Herdr link core: models, snapshot parsing, line-socket client, conversation parsers."

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = "1.12"
notify = { version = "7.0.0", default-features = false, features = ["macos_fsevent"] }
base64 = "0.22.1"
sha2 = "0.10"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std"] }

# Windows process table (uncompiled on this host; see src/resolver/windows.rs)
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.32.1", default-features = false, features = ["system"] }
