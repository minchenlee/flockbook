[workspace]
resolver = "2"
members = ["herdr-core", "flockbook-modfeed", "spike-select", "spike-virt", "spike-ime", "fb-ui", "flockbook"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

# Lints for every crate (each member has `[lints] workspace = true`). Old warnings are frozen, not fixed: the gate is
# scripts/clippy-baseline.mjs (CI job xplat / Clippy), which fails when a count passes xplat/clippy-baseline.json.
# The default groups stay as clippy has them (style, complexity, perf: warn); the two below are errors.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# A panic in the helper or the app ends the person's session: `?`, or `expect("why it cannot fail")`. Tests may.
unwrap_used = "warn"
# The helper's stdout is its protocol: a stray println! breaks the mod. Real output: #[allow(.., reason = "…")].
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
iced = { version = "0.14", features = ["advanced", "markdown"] }
iced_test = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"

[profile.release]
debug = "line-tables-only"

# The helper is copied to other machines (hc file.write, 8 MB a call): no symbols or line tables in it.
[profile.release.package.flockbook-modfeed]
strip = true
debug = false
