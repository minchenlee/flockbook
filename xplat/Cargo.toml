[workspace]
resolver = "2"
members = ["herdr-core", "spike-select", "spike-virt", "spike-ime", "fb-ui", "flockbook"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
iced = { version = "0.14", features = ["advanced", "markdown"] }
iced_test = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[profile.release]
debug = "line-tables-only"

# Dependencies (iced, wgpu, cosmic-text, tiny-skia) run about 10x slower unoptimized; the app's own crates stay at
# opt-level 0 so they still build fast and debug well.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
