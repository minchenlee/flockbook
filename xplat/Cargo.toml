[workspace]
resolver = "2"
members = ["herdr-core", "flockbook-modfeed", "spike-select", "spike-virt", "spike-ime", "fb-ui", "flockbook"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
iced = { version = "0.14", features = ["advanced", "markdown"] }
iced_test = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"

[profile.release]
debug = "line-tables-only"

# The helper is copied to other machines (hc file.write, 8 MB a call): no symbols or line tables in it.
[profile.release.package.flockbook-modfeed]
strip = true
debug = false
