[package]
name = "flockbook"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Flockbook: a reading view for Herdr agents (iced)"

[lib]
name = "flockbook"
path = "src/lib.rs"

[[bin]]
name = "flockbook"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["image", "svg", "canvas", "tiny-skia", "tokio"] }
iced_test.workspace = true
fb-ui = { path = "../fb-ui" }
herdr-core = { path = "../herdr-core" }
png.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
serde.workspace = true
# The config folder for settings.json.
dirs = "6"
pulldown-cmark = { version = "0.12", default-features = false }
window-vibrancy = "0.6"
# The file dialog behind the composer's +. Linux: the XDG desktop portal (no GTK needed).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSColor", "NSGraphics", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
# The composer's + panel (NSOpenPanel takes files and folders in one panel).
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }

[dev-dependencies]
# The perf example reads its own CPU time (getrusage).
libc = "0.2"
