[workspace]
resolver = "2"
members = ["herdrkit", "flockbook-modfeed"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
